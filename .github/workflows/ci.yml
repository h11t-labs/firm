# Full CI: lint + types, the test suite on SQLite across supported Pythons, the same suite
# against live PostgreSQL and MySQL (the conftests pick up FIRM_TEST_*_URL and run every
# database-touching test against each backend), and the opt-in S3 tests against live RustFS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major/minor tags since v8 (supply-chain hardening),
      # so this is pinned to an exact immutable tag and bumped deliberately.
      - uses: astral-sh/setup-uv@v10.0.0
      - name: Check lockfile is current
        run: uv lock --check
      - name: Sync workspace
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check packages tests scripts examples
      - name: ruff format
        run: uv run ruff format --check packages tests scripts examples
      - name: ty
        run: uv run ty check packages scripts examples

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
      - name: Sync workspace
        run: uv sync --locked
      - name: Run tests with coverage (SQLite)
        # SQLite-only, so dialect-specific branches show as uncovered; keep the floor below the
        # measured total (~90%) with margin rather than chasing 100% on one backend.
        run: uv run pytest --cov=firm --cov-fail-under=85

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Sync workspace
        run: uv sync --locked
      - name: Run tests (SQLite)
        run: uv run pytest

  test-live-backends:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: firm
          POSTGRES_PASSWORD: firm
          POSTGRES_DB: firm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: firm
          MYSQL_PASSWORD: firm
          MYSQL_DATABASE: firm
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FIRM_TEST_PG_URL: postgresql://firm:firm@127.0.0.1:5432/firm
      FIRM_TEST_MYSQL_URL: mysql://firm:firm@127.0.0.1:3306/firm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
      - name: Sync workspace
        run: uv sync --locked
      - name: Run tests (SQLite + PostgreSQL + MySQL)
        run: uv run pytest

  # The fake-backed S3 tests already run in every job above (boto3 is a dev dependency). This
  # job adds the real-provider round-trip: audit immutability rests on the provider rejecting
  # a second `If-None-Match: *` PUT, which only a live server can show.
  test-s3:
    runs-on: ubuntu-latest
    services:
      rustfs:
        # Pin the official multi-platform image; the entrypoint uses RUSTFS_VOLUMES.
        image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: firm
          RUSTFS_SECRET_KEY: firm-test-secret
          RUSTFS_VOLUMES: /data
          RUSTFS_CONSOLE_ENABLE: "false"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9000/health/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A skipped live run proves nothing about the provider, so make skips fail here.
      FIRM_TEST_S3_REQUIRED: "1"
      FIRM_TEST_S3_BUCKET: firm-test
      FIRM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: firm
      AWS_SECRET_ACCESS_KEY: firm-test-secret
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
      - name: Sync workspace
        run: uv sync --locked
      - name: Create versioned test bucket
        # The library never provisions buckets, and receipts carry a VersionId only when the
        # bucket is versioned.
        run: |
          uv run python - <<'EOF'
          import os

          import boto3

          s3 = boto3.client("s3", endpoint_url=os.environ["FIRM_TEST_S3_ENDPOINT"])
          bucket = os.environ["FIRM_TEST_S3_BUCKET"]
          s3.create_bucket(Bucket=bucket)
          s3.put_bucket_versioning(Bucket=bucket, VersioningConfiguration={"Status": "Enabled"})
          EOF
      - name: Run live S3 tests (RustFS)
        run: uv run pytest tests/audit/test_s3_integration.py -rs
