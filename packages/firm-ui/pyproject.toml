[project]
name = "firm-ui"
version = "1.0.1"
description = "Optional web dashboard for firm — watch queues, cache, channels, and the audit log. Standard-library server; Jinja2 for templates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "firm contributors" }]
keywords = ["dashboard", "ui", "queue", "cache", "channel", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "firm-core~=1.0",
    "firm-queue~=1.0",
    "firm-cache~=1.0",
    "firm-channel~=1.0",
    "firm-audit~=1.0",
    "jinja2>=3.1.6",
    "jinjax>=0.65",
]

[project.optional-dependencies]
django = ["django>=4.2"]               # firm.ui.contrib.django mount
flask = ["flask>=3.0"]                 # firm.ui.contrib.flask mount
fastapi = ["fastapi>=0.141.1"]           # firm.ui.contrib.fastapi mount

[project.scripts]
firm-ui = "firm.ui.cli:main"

[project.urls]
Homepage = "https://github.com/h11t-labs/firm"
Documentation = "https://h11t-labs.github.io/firm/"
Repository = "https://github.com/h11t-labs/firm"
Issues = "https://github.com/h11t-labs/firm/issues"
Changelog = "https://github.com/h11t-labs/firm/blob/main/packages/firm-ui/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

# firm.ui.contrib (the framework mounts) is a sub-package of firm.ui, so it ships with it.
[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]
module-name = "firm.ui"
namespace = true
